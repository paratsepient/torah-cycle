name: Import prepared source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import source once
        shell: bash
        run: |
          if [ ! -f torah-cycle-source.zip ]; then
            echo "Source has already been imported."
            exit 0
          fi
          mkdir .source-import
          unzip -q torah-cycle-source.zip -d .source-import
          cp -a .source-import/. .
          rm -rf .source-import
          rm torah-cycle-source.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Import complete Astro editorial website"
          git push origin HEAD:main
