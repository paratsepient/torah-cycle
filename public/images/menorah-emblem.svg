<svg xmlns="http://www.w3.org/2000/svg" width="600" height="640" viewBox="0 0 600 640" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Менора в зірці Давида</title>
  <desc id="desc">Сім симетричних променів менори з підставкою та рівними проміжками, оточені фрагментами правильної зірки Давида.</desc>
  <defs>
    <linearGradient id="gold" x1="300" y1="40" x2="300" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF0D4"/>
      <stop offset=".3" stop-color="#EED0A5"/>
      <stop offset=".68" stop-color="#D9BA83"/>
      <stop offset="1" stop-color="#B9925C"/>
    </linearGradient>
    <!-- Two equilateral triangles: centre (300,320), outer radius 280. -->
    <path id="star" d="M300 40 380.829 180H542.487L461.658 320 542.487 460H380.829L300 600 219.171 460H57.513L138.342 320 57.513 180H219.171Z"/>
    <path id="upper-wing" d="M57.513 180H123V293.426Z"/>
    <clipPath id="star-boundary"><use href="#star"/></clipPath>
    <!-- Concentric semicircles: radii 48,96,144; thickness 30; gap 18. -->
    <g id="arms" fill="none" stroke-linecap="butt" stroke-linejoin="round">
      <path d="M252 0V250A48 48 0 0 0 348 250V0"/>
      <path d="M204 0V250A96 96 0 0 0 396 250V0"/>
      <path d="M156 0V250A144 144 0 0 0 444 250V0"/>
    </g>
    <rect id="stem" x="285" width="30" height="450"/>
    <rect id="base" x="207" y="438" width="186" height="22" rx="11"/>
    <!-- Dilating the menorah by 18 units gives every star fragment the same clearance. -->
    <mask id="star-fragments" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="640" mask-type="luminance">
      <rect width="600" height="640" fill="white"/>
      <use href="#arms" stroke="black" stroke-width="66"/>
      <use href="#stem" fill="black" stroke="black" stroke-width="36" stroke-linejoin="round"/>
      <use href="#base" fill="black" stroke="black" stroke-width="36"/>
      <rect width="600" height="320" fill="black"/>
    </mask>
  </defs>
  <use href="#star" fill="url(#gold)" mask="url(#star-fragments)"/>
  <use href="#upper-wing" fill="url(#gold)"/>
  <use href="#upper-wing" fill="url(#gold)" transform="translate(600 0) scale(-1 1)"/>
  <g clip-path="url(#star-boundary)">
    <use href="#arms" stroke="url(#gold)" stroke-width="30"/>
    <use href="#stem" fill="url(#gold)"/>
    <use href="#base" fill="url(#gold)"/>
  </g>
</svg>
